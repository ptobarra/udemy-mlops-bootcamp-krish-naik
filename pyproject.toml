[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udemy-mlops-bootcamp"
version = "0.1.0"
description = "Python fundamentals and data analysis notebooks for the Udemy MLOps bootcamp"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "lxml>=6.1.3",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.setuptools]
py-modules = []
